   if(l===3){let examples=[
    {q:'תלמידים בודקים כיצד כמות הדשן משפיעה על גובה צמחי שעועית. הם משנים רק את כמות הדשן ומשקים את כל הצמחים באותה כמות מים. מהו הגורם הקבוע המתואר?',a:'כמות המים',o:['כמות המים','כמות הדשן','גובה הצמח','המסקנה'],why:'כמות המים נשמרת זהה ולכן היא גורם קבוע.'},
    {q:'בניסוי התקבלו תוצאות שונות מאוד בשלוש חזרות שנעשו לכאורה באותם תנאים. מה הפעולה המדעית המתאימה ביותר?',a:'לבדוק את שיטת המדידה ולבצע חזרות נוספות',o:['לבחור רק את התוצאה הרצויה','לבדוק את שיטת המדידה ולבצע חזרות נוספות','להחליף את שאלת החקר במסקנה','להתעלם מההבדלים'],why:'פערים גדולים בין חזרות מחייבים לבדוק את שיטת המדידה, מקורות שגיאה ולחזור על הבדיקה.'}
   ];let e=pick(examples);return {topic,type:'mc',...e}}
   return {topic,type:'mc',q:'חוקרת משנה את כמות האור לצמחים ומודדת את גובהם לאחר שבועיים. מהו הגורם המושפע?',a:'גובה הצמחים',o:['גובה הצמחים','כמות האור','סוג העציץ','משך השבוע'],why:'הגובה הוא התוצאה הנמדדת ולכן הוא הגורם המושפע.'}
 }
 return {topic,type:'mc',q:l===3?'שתי קוביות בגודל זהה עשויות מחומרים שונים. מה ניתן להסיק בוודאות?':'בקבוק מלא מים נחשב...',a:l===3?'לשתיהן נפח גוף זהה':['גוף'],o:l===3?['לשתיהן נפח גוף זהה','לשתיהן מסה זהה','הן עשויות מאותו חומר','לשתיהן צפיפות זהה']:['גוף','חומר בלבד','יחידת נפח','מכשיר מדידה'],why:l===3?'גודל וצורה זהים נותנים נפח זהה, אך חומר שונה עשוי לתת מסה וצפיפות שונות.':'כמות המים שבבקבוק תופסת מקום ולכן אפשר להתייחס אליה כגוף.'}
}
function gen(topic,l){if(l>=2&&Math.random()<(l===3?.7:.5))return derived(topic,l);let b=pick(BANK[topic]);return {topic,type:b[0],q:b[1],a:b[2],o:b[3],why:b[4]}}
function generate(n,only){let ts=only?[only]:TOPICS;return Array.from({length:n},()=>gen(pick(ts),level))}
function lvl(){return `<div class=grid>${[['קל','הגדרות וזיהוי'],['בינוני','יישום וחישוב'],['מתקדם','יישום במצבים חדשים']].map((x,i)=>`<div class="level ${level===i+1?'sel':''}" onclick="level=${i+1};$$('.level').forEach(e=>e.classList.remove('sel'));this.classList.add('sel')"><b>${x[0]}</b><br><span class=small>${x[1]}</span></div>`).join('')}</div>`}
function nav(){let t=[['home','📖 הסברים'],['practice','✏️ תרגול'],['exam','📝 מבחנים'],['summary','📊 הערכה עצמית']];$('#nav').innerHTML=t.map(x=>`<button id=n${x[0]} onclick="show('${x[0]}')">${x[1]}</button>`).join('')}
function show(id){$$('.page,#nav button').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');$('#n'+id).classList.add('on');if(id==='summary')summary();scrollTo(0,0)}
function inst(q){if(q.type==='txt')return 'הנחיה: כתבי את התשובה המספרית בלבד. אין צורך לכתוב את יחידת המידה.';return 'הנחיה: קראי היטב את השאלה ובחרי תשובה אחת. לאחר הסיום תקבלי גם הסבר.'}
function qhtml(q,i){let b=q.type==='mc'?shuffle(q.o).map(o=>`<label class=opt><input type=radio name=q${i} value="${o}"> ${o}</label>`).join(''):`<input type=text id=a${i} inputmode=decimal>`;return `<div class="card q" id=q${i}><div class=instruction>${inst(q)}</div><p><b>${i+1}.</b> ${q.q}</p>${b}<div class=fb id=f${i}></div></div>`}
function start(kind,n=16,only=null){current=generate(n,only);let h=kind==='exam'?'exam':'practice';$('#'+h+'Body').innerHTML=current.map(qhtml).join('')+`<div class=card style="text-align:center"><button class="btn g" onclick="grade('${kind}')">✔ סיום ובדיקה</button></div>`;$('#'+h+'Result').innerHTML='';show(h)}
function grade(mode){let r=0,run=[];current.forEach((q,i)=>{let v=q.type==='mc'?(document.querySelector(`input[name=q${i}]:checked`)||{}).value:$('#a'+i).value,ok=norm(v)===norm(q.a);if(ok)r++;run.push({topic:q.topic,ok,level,mode,date:Date.now()});let box=$('#q'+i),f=$('#f'+i);box.classList.add(ok?'ok':'bad');f.style.display='block';f.innerHTML=(ok?'✅ נכון!':`❌ התשובה הנכונה: <b>${q.a}</b>`)+`<br>${q.why}`});history.push(...run);try{window.localStorage.setItem('sci7hist',JSON.stringify(history.slice(-600)));storageOK=true}catch(e){storageOK=false}let p=Math.round(100*r/current.length),w=weak(run);let host=mode==='exam'?'examResult':'practiceResult';$('#'+host).innerHTML=`<div class=card><h2>תוצאה: ${p}</h2><p>${p>=90?'🌟 שליטה מצוינת':p>=75?'👍 שליטה טובה, מומלץ לעבור על הטעויות':p>=60?'💪 יש בסיס טוב, אך כדאי לחזק':'📚 מומלץ לחזור להסברים ולתרגל שוב'}</p>${w.length?`<p><b>נושאים לחיזוק:</b> ${w.join(', ')}</p>${w.slice(0,2).map(t=>`<button class=btn onclick="start('practice',12,'${t}')">תרגול חיזוק: ${t}</button>`).join(' ')}`:'<p>✅ אין נושא מתחת ל-75% בסבב זה.</p>'}</div>`;$('#'+host).scrollIntoView({behavior:'smooth'})}
function weak(arr=history){let m={};arr.forEach(x=>{m[x.topic]??=[0,0];m[x.topic][1]++;if(x.ok)m[x.topic][0]++});return Object.entries(m).filter(x=>x[1][1]&&x[1][0]/x[1][1]<.75).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(x=>x[0])}
function workbookPractice(){level=2;let qs=[];TOPICS.forEach(t=>{let arr=BANK[t].filter(x=>String(x[1]).includes('בסגנון החוברת'));arr.forEach(b=>qs.push({topic:t,type:b[0],q:b[1],a:b[2],o:b[3],why:b[4]}))});current=shuffle(qs);$('#practiceBody').innerHTML=current.map(qhtml).join('')+`<div class=card style="text-align:center"><button class="btn g" onclick="grade('practice')">✔ סיום ובדיקה</button></div>`;$('#practiceResult').innerHTML='';show('practice')}
function quickExam(n){start('exam',n)}
function summary(){let m={};history.forEach(x=>{m[x.topic]??=[0,0];m[x.topic][1]++;if(x.ok)m[x.topic][0]++});let rows=TOPICS.map(t=>{let v=m[t]||[0,0],p=v[1]?Math.round(v[0]/v[1]*100):0;return `<tr><td>${t}</td><td>${v[1]}</td><td>${p}%</td><td><div class=bar><i style="width:${p}%"></i></div></td></tr>`}).join(''),w=weak();$('#sumBody').innerHTML=`<div class=card><h2>התקדמות מצטברת</h2><table><tr><th>נושא</th><th>שאלות</th><th>הצלחה</th><th></th></tr>${rows}</table></div><div class=card><h3>המלצה אישית</h3>${!history.length?'עדיין אין תוצאות.':w.length?`כדאי להתמקד ב: <b>${w.join(', ')}</b><br><br>${w.map(t=>`<button class=btn onclick="start('practice',12,'${t}')">תרגול ${t}</button>`).join(' ')}`:'🌟 בכל הנושאים שנמדדו ההצלחה היא 75% ומעלה.'}<p class=small>${storageOK?'ההתקדמות נשמרת בדפדפן במכשיר זה.':'ההתקדמות נשמרת בזיכרון הדף כל עוד הוא פתוח.'}</p></div>`}
function build(){nav();$('#main').innerHTML=`<section id=home class=page><div class=card><h2>📖 הסברים למבחן</h2><p class=warn><b>היקף המבחן:</b> גוף, חקר, מסה ונפח. חומר הלימוד לפי הודעת המורה וחוברת "חוקרים חומר ואנרגיה א'".</p></div>
<div class=card><h2>1. גוף וחומר</h2><p><b>גוף</b> הוא כל דבר שתופס מקום בחלל. גוף יכול להיות חי או דומם, ובמצבי צבירה שונים. <b>חומר</b> הוא מה שממנו עשויים גופים.</p><p>לדוגמה: כוס היא גוף; זכוכית היא חומר. סיר הוא גוף; מתכת היא חומר.</p><div class=tip>זכרי: מסה, נפח וצורה מתארים גוף. צפיפות, קשיות ומוליכות הן דוגמאות לתכונות של חומר.</div></div>
<div class=card><h2>2. חקר מדעי</h2><p>סדר עבודה טיפוסי: <b>שאלת חקר → השערה → תכנון ניסוי → ביצוע ומדידה → תוצאות → מסקנה.</b></p><p><b>גורם משפיע</b>: מה שהחוקר משנה במכוון. <b>גורם מושפע</b>: מה שמודדים בעקבות השינוי. <b>גורמים קבועים</b>: תנאים ששומרים זהים כדי שהבדיקה תהיה הוגנת.</p><div class=tip>דוגמה: האם טמפרטורת המים משפיעה על זמן התמוססות סוכר? משפיע = טמפרטורה; מושפע = זמן התמוססות; קבועים = כמות מים, כמות סוכר, כלי ועוד.</div><p>חוזרים על ניסויים ומדידות כדי לצמצם השפעת מקריות ולהגדיל אמינות.</p></div>
<div class=card><h2>3. מסה</h2><p><b>מסה</b> היא כמות החומר בגוף. מכשיר המדידה: <b>מאזניים</b>. יחידות נפוצות: מ״ג, גרם, ק״ג.</p><div class=formula>1 kg = 1000 g &nbsp;&nbsp; | &nbsp;&nbsp; 1 g = 1000 mg</div><p>שינוי צורה או חלוקת גוף לחלקים אינם משנים את המסה הכוללת, כל עוד לא נוסף ולא אבד חומר.</p><div class=tip>אין לבלבל בין מסה למשקל: המבחן מדגיש מסה, שהיא כמות החומר.</div></div>
<div class=card><h2>4. נפח</h2><p><b>נפח</b> הוא המקום שגוף תופס במרחב.</p><ul><li>נוזל: מודדים במשורה, לרוב במ״ל או ליטר.</li><li>גוף הנדסי: מודדים ממדים ומחשבים לפי נוסחה מתאימה.</li><li>מוצק לא סדיר: משתמשים ב<b>דחיית נוזל</b>. נפח הגוף = מפלס אחרי − מפלס לפני.</li><li>גז: מתפשט ותופס את כל נפח הכלי שבו הוא נמצא.</li></ul><div class=formula>1 L = 1000 mL &nbsp; | &nbsp; 1 mL = 1 cm³</div><div class=tip>בקריאת משורה מניחים אותה על משטח ישר וקוראים בגובה העיניים.</div></div>
<div class=card><h2>📚 תרגול המבוסס על החוברת</h2><p>במאגר השאלות שולבו גם שאלות <b>מעובדות בסגנון התרגילים והניסויים שבחוברת</b>: קריאת משורה, העברת נוזל בין כלים, כיול כלי, חישוב נפח תיבה, דחיית נוזל, שינוי צורת פלסטלינה, מדידת גז במערכת סגורה, מאזני כפות ושימור מסה. הן אינן העתקה ארוכה של הספר, אך שומרות על אותו רעיון וסוג חשיבה כדי לתרגל לקראת שאלות דומות במבחן.</p></div><div class=card><h2>איך להשתמש בכלי?</h2><p>קראי את ההסברים, עברי לתרגול קל, אחר כך בינוני ומתקדם. רק לאחר מכן עברי למבחנים. מסך ההערכה העצמית יזהה אוטומטית נושאים מתחת ל-75% ויציע תרגול ממוקד.</p></div></section>
<section id=practice class=page><div class=card><h2>✏️ דפי תרגול</h2>${lvl()}<p>בכל לחיצה נוצר דף חדש.</p><button class=btn onclick="start('practice',12)">🔄 צור דף תרגול חדש</button> <button class="btn gray" onclick="workbookPractice()">📚 תרגול בסגנון החוברת</button><div class=grid style="margin-top:10px">${TOPICS.map(t=>`<button class=btn onclick="start('practice',10,'${t}')">תרגול ${t}</button>`).join('')}</div></div><div id=practiceBody></div><div id=practiceResult></div></section>
<section id=exam class=page><div class=card><h2>📝 מבחנים</h2>${lvl()}<p>המבחן משלב את כל ארבעת הנושאים. בכל פעם מתקבל סט חדש.</p><button class="btn g" onclick="quickExam(20)">מבחן מלא - 20 שאלות</button> <button class=btn onclick="quickExam(12)">מבחן קצר - 12 שאלות</button> <button class=btn onclick="quickExam(30)">מבחן אתגר - 30 שאלות</button></div><div id=examBody></div><div id=examResult></div></section><section id=summary class=page><div id=sumBody></div></section>`;show('home')}build();
</script></body></html>
